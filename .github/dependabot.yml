version: 2
updates:
  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "actions"

  # Maintain Go dependencies for dewyctl CLI root module
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "go"

  # Maintain Go dependencies for sample application
  - package-ecosystem: "gomod"
    directory: "/app"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(app)"
    labels:
      - "dependencies"
      - "go"
