name: tagpr and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  tagpr:
    name: Manage Release PR & Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run tagpr
        id: tagpr
        uses: Songmu/tagpr@7ebae2dcc300132baa7cc9dd108c8923b07fc366 # v1.20.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Build & Publish Release to Object Storage
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          cache: true

      - name: Install SOPS
        run: |
          SOPS_VER="3.8.1"
          curl -LO "https://github.com/getsops/sops/releases/download/v${SOPS_VER}/sops_${SOPS_VER}_amd64.deb"
          sudo dpkg -i sops_${SOPS_VER}_amd64.deb

      - name: Build dewyctl CLI
        run: go build -o bin/dewyctl .

      - name: Publish Multi-Platform Release to S3 via dewyctl
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./bin/dewyctl release --version "${{ needs.tagpr.outputs.tag }}"

  deploy-test:
    name: Test Ansible Deploy & E2E Validation
    needs: [tagpr, release]
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          cache: true

      - name: Install Ansible & SOPS
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
          SOPS_VER="3.8.1"
          curl -LO "https://github.com/getsops/sops/releases/download/v${SOPS_VER}/sops_${SOPS_VER}_amd64.deb"
          sudo dpkg -i sops_${SOPS_VER}_amd64.deb

      - name: Build dewyctl CLI
        run: go build -o bin/dewyctl .

      - name: Run Docker E2E Verification via dewyctl
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          ./bin/dewyctl docker all --version "${{ needs.tagpr.outputs.tag }}"
