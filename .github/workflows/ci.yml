name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Go Vet
        run: go vet ./...

      - name: Test dewyctl
        run: go test -v ./...

      - name: Build dewyctl
        run: go build -v -o bin/dewyctl .

      - name: Test Sample App
        run: go test -C app -v ./...

      - name: Verify CLI Help
        run: ./bin/dewyctl help
