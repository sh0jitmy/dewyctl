# secrets.example.yml - Example configuration template for dewyctl
#
# DO NOT store real credentials in this file.
# Run 'dewyctl config' (or './bin/dewyctl config') to interactively
# configure your credentials, which will be encrypted into secrets.enc.yml via SOPS.

github_token: placeholder_github_token_here
aws_access_key_id: placeholder_access_key_id_here
aws_secret_access_key: placeholder_secret_access_key_here
s3_bucket: your-bucket-name
s3_region: jp-east-1
s3_endpoint: https://s3.tky01.sakurastorage.jp
deploy_target_ip: 127.0.0.1
sakura_access_token: placeholder_sakura_cloud_token_here
sakura_access_token_secret: placeholder_sakura_cloud_secret_here
sakura_zone: is1b
